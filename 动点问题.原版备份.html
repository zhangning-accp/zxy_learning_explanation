<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>动点问题的五层能力</title>
<style>
  :root{
    --bg:#f1f5f9; --ink:#0f172a; --muted:#64748b;
    --blue:#2563eb; --orange:#ea580c; --green:#16a34a; --purple:#7c3aed; --red:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;padding:20px 14px 44px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       background:var(--bg);color:var(--ink);display:flex;justify-content:center;}
  .wrap{width:100%;max-width:820px;}
  h1{font-size:20px;margin:0 0 5px;text-align:center;font-weight:700;}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px;}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:0 0 16px;}
  .tab{font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:20px;border:none;
       cursor:pointer;background:#e2e8f0;color:#475569;transition:all .18s;}
  .tab:hover{background:#cbd5e1;}
  .tab.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35);}
  .card{background:#fff;border-radius:20px;padding:16px 14px 20px;box-shadow:0 4px 24px rgba(15,23,42,.07);}
  .cap{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;padding-left:4px;}
  svg{width:100%;display:block;touch-action:none;user-select:none;}
  svg text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:8px;}
  .ctrl label{font-size:14px;font-weight:600;color:#475569;white-space:nowrap;}
  .val{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue);min-width:42px;display:inline-block;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
    background:#e2e8f0;outline:none;flex:1;min-width:130px;max-width:300px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--blue);cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.45);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:none;border-radius:50%;
    background:var(--blue);cursor:pointer;}
  .seg{display:flex;background:#eef2f7;border-radius:12px;padding:4px;gap:3px;}
  .seg button{font:inherit;font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:9px;border:none;
    cursor:pointer;background:transparent;color:#64748b;transition:all .15s;white-space:nowrap;}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 6px rgba(15,23,42,.12);}
  .seg.frame button.on{color:var(--purple);}
  .btn{font:inherit;font-size:14.5px;font-weight:700;padding:10px 22px;border-radius:12px;border:none;
    cursor:pointer;background:var(--blue);color:#fff;box-shadow:0 3px 0 #1e40af;
    transition:transform .08s,box-shadow .08s;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1e40af;}
  .btn.ghost{background:#e2e8f0;color:#475569;box-shadow:0 3px 0 #cbd5e1;}
  .btn.ghost:active{box-shadow:0 1px 0 #cbd5e1;}
  .read{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0;}
  @media(min-width:560px){.read.four{grid-template-columns:repeat(4,1fr);}}
  .ro{background:#f8fafc;border-radius:12px;padding:9px 6px;text-align:center;}
  .ro .k{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;}
  .ro .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cases{display:grid;gap:8px;margin:14px 0 0;}
  .case{background:#f8fafc;border:2px solid #e2e8f0;border-radius:13px;padding:9px 13px;transition:all .25s;}
  .case .ch{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;}
  .case .cf{font-size:14px;font-weight:700;margin-top:3px;line-height:1.5;color:#475569;}
  .case.on{background:#eff6ff;border-color:var(--blue);}
  .case.on .ch{color:var(--blue);}
  .case.on .cf{color:#1e3a8a;}
  .exp{background:#fffbeb;border-left:4px solid #f59e0b;border-radius:0 12px 12px 0;
       padding:12px 15px;margin-top:16px;font-size:14px;line-height:1.75;color:#78350f;}
  .exp b{color:#b45309;}
  .exp .kw{background:#fef3c7;padding:1px 5px;border-radius:4px;font-weight:700;color:#92400e;}
  .sol{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
  .sol .chip{background:#dcfce7;color:#15803d;font-weight:800;font-size:14px;
    padding:7px 15px;border-radius:20px;border:2px solid #86efac;}
  .sol .chip.bad{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;text-decoration:line-through;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>动点问题的五层能力</h1>
  <p class="sub">每一关训练一种底层思维，点开标签试试</p>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="cap" id="cap"></div>
    <svg id="stage" viewBox="0 0 700 270"></svg>
    <div class="ctrl" id="ctrl"></div>
    <div class="read" id="read"></div>
    <div class="sol" id="sol"></div>
    <div class="exp" id="exp"></div>
  </div>
</div>

<script>
(function(){
  const W = 700;
  const svg    = document.getElementById('stage');
  const capEl  = document.getElementById('cap');
  const ctrlEl = document.getElementById('ctrl');
  const readEl = document.getElementById('read');
  const solEl  = document.getElementById('sol');
  const expEl  = document.getElementById('exp');

  const fmt = n => {
    const r = Math.round(n * 100) / 100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/\.?0+$/, '');
  };
  const dot = (x, y, r, fill, stroke) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"` +
    (stroke ? ` stroke="${stroke}" stroke-width="2.5"` : '') + `/>`;

  /* ============ 通用数轴 ============ */
  function axis(min, max, y, opt = {}) {
    const padL = opt.padL ?? 46, padR = opt.padR ?? 46;
    const s = (W - padL - padR) / (max - min);
    const toPx = v => padL + (v - min) * s;
    const toVal = px => min + (px - padL) / s;
    const step = opt.step ?? 2;
    const lab  = opt.labelStep ?? step * 2;

    let out = `<line x1="${padL - 24}" y1="${y}" x2="${W - padR + 24}" y2="${y}"
      stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>`;
    out += `<polygon points="${W - padR + 30},${y} ${W - padR + 14},${y - 6} ${W - padR + 14},${y + 6}" fill="#94a3b8"/>`;

    const start = Math.ceil(min / step) * step;
    const count = Math.floor((max - start) / step + 1e-9);
    for (let i = 0; i <= count; i++) {
      const v = Math.round((start + i * step) * 1000) / 1000;
      const x = toPx(v);
      const major = Math.abs(v % lab) < 1e-9;
      out += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + (major ? 9 : 6)}"
        stroke="${major ? '#94a3b8' : '#cbd5e1'}" stroke-width="${major ? 2 : 1.5}"/>`;
      if (major) out += `<text x="${x}" y="${y + 27}" text-anchor="middle" font-size="12" fill="#64748b">${v}</text>`;
    }
    return { out, toPx, toVal, s };
  }

  /* ============ 状态 ============ */
  const S = { level: 1, t: 0, p: 4, k: 2, mode: 'meet', frame: 'ground', playing: false, tMeet: 0 };
  let rafId = null, lastTs = 0;

  /* ============ 标签页 ============ */
  const TABS = [
    { n: 1, t: '① 翻译成数' },
    { n: 2, t: '② 距离=绝对值' },
    { n: 3, t: '③ 动中取静' },
    { n: 4, t: '④ 方程与分类' },
    { n: 5, t: '⑤ 相对运动' }
  ];
  const tabsEl = document.getElementById('tabs');
  TABS.forEach(o => {
    const b = document.createElement('button');
    b.className = 'tab' + (o.n === 1 ? ' on' : '');
    b.textContent = o.t;
    b.dataset.n = o.n;
    b.onclick = () => setLevel(o.n);
    tabsEl.appendChild(b);
  });

  function setLevel(n) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    S.playing = false;
    S.level = n;
    tabsEl.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
    if (n === 1) S.t = 0;
    if (n === 2 || n === 3) S.p = 4;
    if (n === 4) S.k = 2;
    if (n === 5) { S.t = 0; S.mode = 'meet'; S.frame = 'ground'; }
    build();
  }

  function build() {
    ctrlEl.innerHTML = ''; readEl.innerHTML = ''; solEl.innerHTML = ''; expEl.innerHTML = '';
    readEl.className = 'read';
    ({ 1: buildL1, 2: buildL2, 3: buildL3, 4: buildL4, 5: buildL5 })[S.level]();
    draw();
  }

  function draw() {
    ({ 1: drawL1, 2: drawL2, 3: drawL3, 4: drawL4, 5: drawL5 })[S.level]();
  }

  /* ============================================================
     关卡 1：坐标化 —— 把“动”翻译成“数”
     ============================================================ */
  const L1 = { A: 2, v: 3, tMax: 6, H: 200, axisY: 138 };

  function buildL1() {
    capEl.textContent = '能力① 坐标化：位置 = 起点 + 速度 × 时间';
    ctrlEl.innerHTML =
      `<label>时间 t = <span class="val" id="v1t">0</span> 秒</label>
       <input type="range" id="s1" min="0" max="${L1.tMax}" step="0.1" value="0">`;
    readEl.classList.add('four');
    readEl.innerHTML =
      `<div class="ro"><span class="k">起点 A</span><span class="v" style="color:#334155">${L1.A}</span></div>
       <div class="ro"><span class="k">速度 v</span><span class="v" style="color:#334155">${L1.v}</span></div>
       <div class="ro"><span class="k">走了 3t</span><span class="v" style="color:#2563eb" id="r1d">0</span></div>
       <div class="ro"><span class="k">P 的位置</span><span class="v" style="color:#ef4444" id="r1p">2</span></div>`;
    expEl.innerHTML = `动点题的<b>第一步不是算，是翻译</b>。
      P 从 A(${L1.A}) 出发，每秒走 ${L1.v} 格，走了 t 秒，就走了 <span class="kw">3t</span> 格。<br>
      所以 P 的位置 = <span class="kw">${L1.A} + 3t</span>。
      把「动」变成含 t 的式子，后面所有问题才有得算。`;
    document.getElementById('s1').oninput = e => {
      S.t = +e.target.value;
      drawL1();
    };
  }

  function drawL1() {
    const { A, v, H, axisY } = L1;
    const P = A + v * S.t;
    const ax = axis(-1, 23, axisY, { step: 2, labelStep: 2 });
    const xa = ax.toPx(A), xp = ax.toPx(P);

    let g = '';
    g += `<text x="${W / 2}" y="36" text-anchor="middle" font-size="21" font-weight="800"
            fill="#0f172a" font-family="Georgia,serif">P = 起点 + 速度 × 时间</text>`;
    g += `<text x="${W / 2}" y="80" text-anchor="middle" font-size="28" font-weight="800"
            fill="#2563eb" font-family="Georgia,serif">P = ${A} + ${v} × ${fmt(S.t)} = ${fmt(P)}</text>`;

    g += ax.out;

    if (xp - xa > 3) {
      g += `<rect x="${xa}" y="${axisY - 7}" width="${xp - xa}" height="14" rx="7" fill="#bfdbfe"/>`;
    }
    g += dot(xa, axisY, 7.5, '#334155');
    g += `<text x="${xa}" y="${axisY - 20}" text-anchor="middle" font-size="16"
            font-weight="800" fill="#334155">A</text>`;
    g += dot(xp, axisY, 9.5, '#ef4444', '#fff');
    g += `<text x="${xp}" y="${axisY - 22}" text-anchor="middle" font-size="16"
            font-weight="800" fill="#ef4444">P</text>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    document.getElementById('v1t').textContent = fmt(S.t);
    document.getElementById('r1d').textContent = fmt(v * S.t);
    document.getElementById('r1p').textContent = fmt(P);
  }

  /* ============================================================
     关卡 2：距离 = 绝对值 —— 为什么要分类
     ============================================================ */
  const L2 = { min: -4, max: 12, A: 0, B: 8, H: 300, axisY: 258, top: 22, bot: 165, dMax: 16 };

  function buildL2() {
    capEl.textContent = '能力② 距离 = |两数之差|，绝对值逼你分类讨论';
    ctrlEl.innerHTML =
      `<label>拖动 P：</label>
       <input type="range" id="s2" min="${L2.min}" max="${L2.max}" step="0.25" value="${S.p}">
       <span class="val" id="v2p">4</span>`;
    readEl.innerHTML =
      `<div class="ro"><span class="k">P 的位置</span><span class="v" style="color:#ef4444" id="r2p">4</span></div>
       <div class="ro"><span class="k">PA = |P − 0|</span><span class="v" style="color:#2563eb" id="r2a">4</span></div>
       <div class="ro"><span class="k">PB = |P − 8|</span><span class="v" style="color:#ea580c" id="r2b">4</span></div>
       <div class="ro"><span class="k">当前情形</span><span class="v" style="font-size:15px" id="r2c">②</span></div>`;
    expEl.innerHTML = `距离公式是 <span class="kw">|P − A|</span>，但绝对值里<b>不知道谁大谁小</b>，没法直接算。<br>
      所以必须分三段看：P 在 A 左边、在 AB 之间、在 B 右边。
      这三段里 PA 的表达式完全不同——<b>这就是动点题「分类讨论」的根源</b>，不是老师故意为难你。`;
    document.getElementById('s2').oninput = e => {
      S.p = +e.target.value;
      drawL2();
    };
  }

  function drawL2() {
    const { min, max, A, B, H, axisY, top, bot, dMax } = L2;
    const P = S.p;
    const ax = axis(min, max, axisY, { step: 1, labelStep: 2 });
    const xp = ax.toPx(P), xa = ax.toPx(A), xb = ax.toPx(B);
    const toY = d => bot - (d / dMax) * (bot - top);
    const PA = Math.abs(P - A), PB = Math.abs(P - B);
    const seg = P <= A ? 1 : (P <= B ? 2 : 3);

    let g = '';

    const bands = [
      { x1: ax.toPx(min), x2: xa, c: '#fef2f2', id: 1 },
      { x1: xa, x2: xb, c: '#f0fdf4', id: 2 },
      { x1: xb, x2: ax.toPx(max), c: '#fff7ed', id: 3 }
    ];
    bands.forEach(b => {
      g += `<rect x="${b.x1}" y="${top - 4}" width="${Math.max(b.x2 - b.x1, 0)}"
              height="${bot - top + 8}" fill="${b.c}" opacity="${b.id === seg ? 1 : .45}"/>`;
    });

    g += `<line x1="${ax.toPx(min)}" y1="${toY(0)}" x2="${ax.toPx(max)}" y2="${toY(0)}"
            stroke="#e2e8f0" stroke-width="1.5"/>`;

    g += `<path d="M ${ax.toPx(min)} ${toY(Math.abs(min - A))} L ${xa} ${toY(0)} L ${ax.toPx(max)} ${toY(Math.abs(max - A))}"
            fill="none" stroke="#60a5fa" stroke-width="3" stroke-linejoin="round"/>`;
    g += `<path d="M ${ax.toPx(min)} ${toY(Math.abs(min - B))} L ${xb} ${toY(0)} L ${ax.toPx(max)} ${toY(Math.abs(max - B))}"
            fill="none" stroke="#fb923c" stroke-width="3" stroke-linejoin="round"/>`;

    g += `<line x1="${xp}" y1="${top - 4}" x2="${xp}" y2="${axisY}" stroke="#cbd5e1"
            stroke-width="1.5" stroke-dasharray="4 4"/>`;

    g += dot(xp, toY(PA), 6.5, '#2563eb', '#fff');
    g += dot(xp, toY(PB), 6.5, '#ea580c', '#fff');

    g += ax.out;
    g += dot(xa, axisY, 7, '#334155');
    g += `<text x="${xa}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">A</text>`;
    g += dot(xb, axisY, 7, '#334155');
    g += `<text x="${xb}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">B</text>`;
    g += dot(xp, axisY, 9, '#ef4444', '#fff');
    g += `<text x="${xp}" y="${axisY - 22}" text-anchor="middle" font-size="15" font-weight="800" fill="#ef4444">P</text>`;

    g += `<text x="${ax.toPx(min)}" y="${top + 8}" font-size="12" font-weight="700" fill="#2563eb">PA</text>`;
    g += `<text x="${ax.toPx(max)}" y="${top + 8}" text-anchor="end" font-size="12" font-weight="700" fill="#ea580c">PB</text>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    document.getElementById('v2p').textContent = fmt(P);
    document.getElementById('r2p').textContent = fmt(P);
    document.getElementById('r2a').textContent = fmt(PA);
    document.getElementById('r2b').textContent = fmt(PB);
    document.getElementById('r2c').textContent = ['', '① P ≤ A', '② A ≤ P ≤ B', '③ P ≥ B'][seg];
  }

  /* ============================================================
     关卡 3：动中取静 —— PA+PB 的不变量
     ============================================================ */
  const L3 = { min: -4, max: 12, A: 0, B: 8, H: 300, axisY: 258, top: 22, bot: 165, dMax: 18 };

  function buildL3() {
    capEl.textContent = '能力③ 动中取静：谁在变，谁不变？';
    ctrlEl.innerHTML =
      `<label>拖动 P：</label>
       <input type="range" id="s3" min="${L3.min}" max="${L3.max}" step="0.25" value="${S.p}">
       <span class="val" id="v3p">4</span>`;
    readEl.innerHTML =
      `<div class="ro"><span class="k">PA</span><span class="v" style="color:#2563eb" id="r3a">4</span></div>
       <div class="ro"><span class="k">PB</span><span class="v" style="color:#ea580c" id="r3b">4</span></div>
       <div class="ro"><span class="k">PA + PB</span><span class="v" style="color:#7c3aed" id="r3s">8</span></div>
       <div class="ro"><span class="k">AB 的长</span><span class="v" style="color:#334155">8</span></div>`;
    expEl.innerHTML = `P 一动，PA 变、PB 也变，但它们的<b>和</b>藏着秘密：<br>
      只要 P 落在 AB 之间，<span class="kw">PA + PB = AB = 8</span>，是个定值！<br>
      动点压轴题常考的就是这种「<b>不变量</b>」——先找谁不变，再列式子。`;
    document.getElementById('s3').oninput = e => {
      S.p = +e.target.value;
      drawL3();
    };
  }

  function drawL3() {
    const { min, max, A, B, H, axisY, top, bot, dMax } = L3;
    const P = S.p;
    const ax = axis(min, max, axisY, { step: 1, labelStep: 2 });
    const xp = ax.toPx(P), xa = ax.toPx(A), xb = ax.toPx(B);
    const toY = d => bot - (d / dMax) * (bot - top);
    const f = x => Math.abs(x - A) + Math.abs(x - B);
    const sum = f(P);

    let g = '';
    g += `<rect x="${xa}" y="${toY(8) - 10}" width="${xb - xa}" height="20" rx="10"
            fill="#dcfce7" opacity="${P >= A && P <= B ? 1 : .5}"/>`;

    g += `<path d="M ${ax.toPx(min)} ${toY(f(min))} L ${xa} ${toY(8)} L ${xb} ${toY(8)} L ${ax.toPx(max)} ${toY(f(max))}"
            fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/>`;

    g += `<line x1="${xp}" y1="${toY(sum)}" x2="${xp}" y2="${axisY}"
            stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    g += dot(xp, toY(sum), 7, '#7c3aed', '#fff');
    g += `<text x="${(xa + xb) / 2}" y="${toY(8) - 16}" text-anchor="middle" font-size="12"
            font-weight="800" fill="#16a34a">PA+PB = AB = 8（定值）</text>`;

    g += ax.out;
    g += dot(xa, axisY, 7, '#334155');
    g += `<text x="${xa}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">A</text>`;
    g += dot(xb, axisY, 7, '#334155');
    g += `<text x="${xb}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">B</text>`;
    g += dot(xp, axisY, 9, '#ef4444', '#fff');
    g += `<text x="${xp}" y="${axisY - 22}" text-anchor="middle" font-size="15" font-weight="800" fill="#ef4444">P</text>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    document.getElementById('v3p').textContent = fmt(P);
    document.getElementById('r3a').textContent = fmt(Math.abs(P - A));
    document.getElementById('r3b').textContent = fmt(Math.abs(P - B));
    document.getElementById('r3s').textContent = fmt(sum);
  }

  /* ============================================================
     关卡 4：方程与分类 —— 为什么会有两个答案
     ============================================================ */
  const L4 = { min: -8, max: 20, A: 0, B: 8, H: 330, axisY: 288, top: 24, bot: 175 };

  function solveL4(k) {
    const A = L4.A, B = L4.B;
    const res = [];
    if (Math.abs(k - 1) > 1e-9) {
      const p = (k * B - A) / (k - 1);
      if (p <= A + 1e-9) res.push({ p, seg: 1 });
      if (p >= B - 1e-9) res.push({ p, seg: 3 });
    }
    const p2 = (A + k * B) / (k + 1);
    if (p2 >= A - 1e-9 && p2 <= B + 1e-9) res.push({ p: p2, seg: 2 });
    return res.sort((a, b) => a.p - b.p);
  }

  function buildL4() {
    capEl.textContent = '能力④ 列方程 + 分类讨论：同一条件，可能有几个答案？';
    ctrlEl.innerHTML =
      `<label>条件 PA = </label>
       <div class="seg" id="kseg">
         ${[1, 2, 3].map(k => `<button data-k="${k}" class="${k === S.k ? 'on' : ''}">${k} × PB</button>`).join('')}
       </div>`;
    readEl.innerHTML =
      `<div class="ro"><span class="k">方程</span><span class="v" style="font-size:16px;color:#7c3aed" id="r4e">|P| = 2|P−8|</span></div>
       <div class="ro"><span class="k">解的个数</span><span class="v" style="color:#16a34a" id="r4n">2</span></div>`;
    solEl.innerHTML = '';
    expEl.innerHTML = `把「PA = 2PB」写成方程 <span class="kw">|P| = 2|P − 8|</span>，然后<b>必须按 P 的位置分三段</b>拆绝对值。<br>
      拆完每段解一个方程，再<b>回头检查这个解是否真的落在本段范围内</b>——落在里面的才算数。这就是「检验」。`;
    document.querySelectorAll('#kseg button').forEach(b => {
      b.onclick = () => {
        S.k = +b.dataset.k;
        document.querySelectorAll('#kseg button').forEach(x => x.classList.toggle('on', x === b));
        drawL4();
      };
    });
  }

  function drawL4() {
    const { min, max, A, B, H, axisY, top, bot } = L4;
    const k = S.k;
    const ax = axis(min, max, axisY, { step: 2, labelStep: 4 });
    const f = x => Math.abs(x - A) - k * Math.abs(x - B);

    const vals = [f(min), f(A), f(B), f(max), 0];
    let fMin = Math.min(...vals), fMax = Math.max(...vals);
    const pad = (fMax - fMin) * 0.12 + 1;
    fMin -= pad; fMax += pad;
    const toY = v => bot - (v - fMin) / (fMax - fMin) * (bot - top);

    let g = '';
    g += `<line x1="${ax.toPx(min)}" y1="${toY(0)}" x2="${ax.toPx(max)}" y2="${toY(0)}"
            stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>`;
    g += `<text x="${ax.toPx(min) - 6}" y="${toY(0) + 4}" text-anchor="end" font-size="11" fill="#94a3b8">0</text>`;

    const p1 = ax.toPx(min), p2 = ax.toPx(A), p3 = ax.toPx(B), p4 = ax.toPx(max);
    g += `<path d="M ${p1} ${toY(f(min))} L ${p2} ${toY(f(A))} L ${p3} ${toY(f(B))} L ${p4} ${toY(f(max))}"
            fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/>`;

    const sols = solveL4(k);
    sols.forEach(s => {
      const x = ax.toPx(s.p);
      g += `<line x1="${x}" y1="${toY(0)}" x2="${x}" y2="${axisY}"
              stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      g += dot(x, toY(0), 7, '#16a34a', '#fff');
      g += `<text x="${x}" y="${toY(0) - 12}" text-anchor="middle" font-size="13"
              font-weight="800" fill="#15803d">P=${fmt(s.p)}</text>`;
    });

    g += ax.out;
    g += dot(ax.toPx(A), axisY, 7, '#334155');
    g += `<text x="${ax.toPx(A)}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">A</text>`;
    g += dot(ax.toPx(B), axisY, 7, '#334155');
    g += `<text x="${ax.toPx(B)}" y="${axisY - 18}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">B</text>`;

    g += `<text x="${p1 + 4}" y="${top + 12}" font-size="12" font-weight="700" fill="#7c3aed">
            f(P) = PA − ${k}·PB</text>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    document.getElementById('r4e').textContent = `|P| = ${k}|P−8|`;
    document.getElementById('r4n').textContent = String(sols.length);

    const A0 = L4.A, B0 = L4.B;
    const rows = [
      { id: 1, cond: 'P ≤ A（P ≤ 0）', eq: `−P = ${k}(8 − P)`, p: k === 1 ? null : (k * B0 - A0) / (k - 1) },
      { id: 2, cond: 'A ≤ P ≤ B（0 ≤ P ≤ 8）', eq: `P = ${k}(8 − P)`, p: (A0 + k * B0) / (k + 1) },
      { id: 3, cond: 'P ≥ B（P ≥ 8）', eq: `P = ${k}(P − 8)`, p: k === 1 ? null : (k * B0 - A0) / (k - 1) }
    ];
    solEl.innerHTML = rows.map(r => {
      if (r.p === null) return `<span class="chip bad">${r.cond}：方程无解</span>`;
      const ok = sols.some(s => Math.abs(s.p - r.p) < 1e-6 && s.seg === r.id);
      return `<span class="chip ${ok ? '' : 'bad'}">${r.cond}：P = ${fmt(r.p)}${ok ? ' ✓' : ' ✗ 不在本段'}</span>`;
    }).join('');

    const casesHTML = rows.map(r => {
      const ok = sols.some(s => Math.abs(s.p - r.p) < 1e-6 && s.seg === r.id);
      return `<div class="case ${ok ? 'on' : ''}">
        <div class="ch">情形 ${['①', '②', '③'][r.id - 1]}</div>
        <div class="cf">${r.cond}　→　${r.p === null ? '无解' : 'P = ' + fmt(r.p) + (ok ? ' ✓' : ' ✗')}</div>
      </div>`;
    }).join('');
    if (!readEl.querySelector('.cases')) {
      const d = document.createElement('div');
      d.className = 'cases';
      d.style.gridColumn = '1 / -1';
      d.innerHTML = casesHTML;
      readEl.appendChild(d);
    } else {
      readEl.querySelector('.cases').innerHTML = casesHTML;
    }
  }

  /* ============================================================
     关卡 5：相对运动 —— 把两个动点看成一个
     ============================================================ */
  const L5 = { A: 2, B: 12, min: 0, max: 18, H: 310, axisY: 240 };
  const MODES = {
    meet:  { vP: 2, vQ: 3, vRel: 5, tMeet: 2, name: '相向而行' },
    chase: { vP: 3, vQ: 1, vRel: 2, tMeet: 5, name: '同向追及' }
  };

  function buildL5() {
    capEl.textContent = '能力⑤ 相对运动：把两个动点看成一个';
    ctrlEl.innerHTML =
      `<div class="seg" id="mseg">
         <button data-m="meet" class="on">相向而行</button>
         <button data-m="chase">同向追及</button>
       </div>
       <div class="seg frame" id="fseg">
         <button data-f="ground" class="on">地面视角</button>
         <button data-f="q">Q 不动视角</button>
       </div>
       <button class="btn" id="playBtn">▶ 播放</button>
       <button class="btn ghost" id="resetBtn">↺ 重置</button>`;

    readEl.className = 'read four';
    readEl.innerHTML =
      `<div id="eq5" style="grid-column:1/-1;text-align:center;font-size:24px;font-weight:800;
            font-family:Georgia,serif;padding:4px 0 8px;color:#0f172a;"></div>
       <div class="ro"><span class="k">时间 t</span><span class="v" id="r5t">0</span></div>
       <div class="ro"><span class="k">P 的位置</span><span class="v" style="color:#ef4444" id="r5p">2</span></div>
       <div class="ro"><span class="k">Q 的位置</span><span class="v" style="color:#7c3aed" id="r5q">12</span></div>
       <div class="ro"><span class="k">PQ 距离</span><span class="v" style="color:#16a34a" id="r5d">10</span></div>`;

    expEl.innerHTML = `两个点一起动很乱？<b>换个视角</b>：把 Q 按住不动，让 P 以「相对速度」去走。<br>
      相向时相对速度 = <span class="kw">v₁ + v₂</span>；追及时 = <span class="kw">v₁ − v₂</span>。
      于是 <b>相遇时间 = 距离 ÷ 相对速度</b>，双动点题就变成一道除法题。`;

    document.querySelectorAll('#mseg button').forEach(b => {
      b.onclick = () => {
        stopPlay();
        S.mode = b.dataset.m;
        S.t = 0;
        document.querySelectorAll('#mseg button').forEach(x => x.classList.toggle('on', x === b));
        drawL5();
      };
    });

    document.querySelectorAll('#fseg button').forEach(b => {
      b.onclick = () => {
        S.frame = b.dataset.f;
        document.querySelectorAll('#fseg button').forEach(x => x.classList.toggle('on', x === b));
        drawL5();
      };
    });

    document.getElementById('playBtn').onclick = () => {
      if (S.playing) { stopPlay(); return; }
      if (S.t >= MODES[S.mode].tMeet - 1e-6) S.t = 0;
      S.playing = true;
      lastTs = 0;
      rafId = requestAnimationFrame(tick);
      document.getElementById('playBtn').textContent = '⏸ 暂停';
      drawL5();
    };

    document.getElementById('resetBtn').onclick = () => {
      stopPlay();
      S.t = 0;
      drawL5();
    };
  }

  function stopPlay() {
    S.playing = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    const b = document.getElementById('playBtn');
    if (b) b.textContent = '▶ 播放';
  }

  function tick(ts) {
    if (!S.playing) return;
    if (!lastTs) lastTs = ts;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    S.t += dt;
    if (S.t >= S.tMeet) { S.t = S.tMeet; stopPlay(); }
    drawL5();
    if (S.playing) rafId = requestAnimationFrame(tick);
  }

  function drawL5() {
    const { A, B, min, max, H, axisY } = L5;
    const m = MODES[S.mode];
    const qFixed = S.frame === 'q';

    // 时间与位置
    const t = S.t;
    let pPos, qPos;
    if (!qFixed) {
      pPos = A + m.vP * t;
      qPos = B + (S.mode === 'meet' ? -1 : 1) * m.vQ * t;
    } else {
      pPos = A + m.vRel * t;
      qPos = B;
    }
    const dist = qFixed ? Math.abs(B - pPos) : Math.abs(qPos - pPos);
    S.tMeet = m.tMeet;

    const ax = axis(min, max, axisY, { step: 2, labelStep: 2 });
    const xa = ax.toPx(A), xb = ax.toPx(B), xp = ax.toPx(pPos), xq = ax.toPx(qPos);

    let g = '';

    // 起点标记
    g += `<circle cx="${xa}" cy="${axisY}" r="5" fill="#cbd5e1"/>`;
    g += `<text x="${xa}" y="${axisY + 44}" text-anchor="middle" font-size="11" fill="#94a3b8">A(${A})</text>`;
    g += `<circle cx="${xb}" cy="${axisY}" r="5" fill="#cbd5e1"/>`;
    g += `<text x="${xb}" y="${axisY + 44}" text-anchor="middle" font-size="11" fill="#94a3b8">B(${B})</text>`;

    // PQ 距离条
    const l = Math.min(xp, xq), w = Math.abs(xq - xp);
    if (w > 1.5) {
      g += `<rect x="${l}" y="${axisY - 46}" width="${w}" height="10" rx="5" fill="#bbf7d0"/>`;
      g += `<text x="${l + w / 2}" y="${axisY - 56}" text-anchor="middle" font-size="13"
              font-weight="800" fill="#15803d">PQ = ${fmt(dist)}</text>`;
    }

    g += ax.out;

    // Q 点
    g += dot(xq, axisY, 9.5, '#7c3aed', '#fff');
    g += `<text x="${xq}" y="${axisY - 18}" text-anchor="middle" font-size="15"
            font-weight="800" fill="#7c3aed">Q</text>`;
    if (qFixed) {
      g += `<text x="${xq}" y="${axisY - 36}" text-anchor="middle" font-size="11"
              font-weight="700" fill="#7c3aed">📌 钉住不动</text>`;
    }

    // P 点
    g += dot(xp, axisY, 9.5, '#ef4444', '#fff');
    g += `<text x="${xp}" y="${axisY - 18}" text-anchor="middle" font-size="15"
            font-weight="800" fill="#ef4444">P</text>`;

    // P 的速度标签
    const vShow = qFixed ? m.vRel : m.vP;
    g += `<text x="${xp}" y="${axisY + 20}" text-anchor="middle" font-size="11"
            font-weight="700" fill="#ef4444">v = ${vShow}</text>`;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;

    // 方程
    const eq5 = document.getElementById('eq5');
    if (eq5) {
      if (!qFixed) {
        eq5.innerHTML = S.mode === 'meet'
          ? `2t <span style="color:#16a34a">+</span> 3t = 10　→　<span style="color:#16a34a">5t = 10</span>`
          : `3t <span style="color:#16a34a">−</span> 1t = 10　→　<span style="color:#16a34a">2t = 10</span>`;
      } else {
        eq5.innerHTML = `${m.vRel}t = 10`;
      }
    }

    // 读数
    document.getElementById('r5t').textContent = fmt(t);
    document.getElementById('r5p').textContent = fmt(pPos);
    document.getElementById('r5q').textContent = fmt(qPos);
    document.getElementById('r5d').textContent = fmt(dist);

    // 解释
    if (!qFixed) {
      expEl.innerHTML = S.mode === 'meet'
        ? `P 每秒向右走 2，Q 每秒向左走 3，<b>距离每秒缩短 2 + 3 = 5</b>。<br>
           所以 (2+3)t = 10，t = 2 秒相遇。`
        : `P 每秒追近 3 − 1 = 2，<b>距离每秒缩短 2</b>。<br>
           所以 (3−1)t = 10，t = 5 秒追上。`;
    } else {
      expEl.innerHTML = S.mode === 'meet'
        ? `Q 被按住不动，P 用<b>相对速度 5</b> 去靠近 Q：5t = 10，t = 2 秒。<br>
           和地面视角的相遇时间完全一样。`
        : `Q 被按住不动，P 用<b>相对速度 2</b> 去追 Q：2t = 10，t = 5 秒。<br>
           和地面视角的追及时间完全一样。`;
    }

    // 底部规律
    expEl.innerHTML += `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #fcd34d;
        font-size:13px;color:#b45309;">
      ${S.mode === 'meet'
        ? `相向而行：相对速度 = <span style="background:#fef3c7;padding:1px 5px;border-radius:4px;font-weight:700;">v₁ + v₂</span>。一个往右、一个往左，<b>两个速度在合力缩短距离</b>。`
        : `同向追及：相对速度 = <span style="background:#fef3c7;padding:1px 5px;border-radius:4px;font-weight:700;">v₁ − v₂</span>。两个都往右，<b>快的要先“抵消”慢的</b>，多出来的才是追近的速度。`}
    </div>`;
  }

  /* ============ 启动 ============ */
  build();
})();
</script>
</body>
</html>

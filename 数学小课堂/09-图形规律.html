</style><body><div class="shell"><header><a href="index.html">← 数学小课堂</a><span class="small">一次弄懂一点点 · 可离线学习</span></header><div class="layout"><aside><span class="eyebrow">LESSON 09</span><h2>一步一步来</h2><nav id="nav" aria-label="学习步骤"></nav><p class="small" id="saved"></p><button id="reset">重新学习本课</button></aside><main><h1>图形规律：数结构，不猜数字</h1><p>从可见结构推导通式，并用小图验证。</p><p class="small">对应周练：第 22 题；联系第 13 题 · 建议 10～15 分钟，可分次完成</p><div id="app"></div></main></div></div><script>const LESSON={"slug": "09-图形规律", "title": "图形规律：数结构，不猜数字", "source": "第 22 题；联系第 13 题", "goal": "从可见结构推导通式，并用小图验证。", "logic": ["第 n 个棋盘每边有 2n−1 格。奇数行有 n 个黑格，共 n 行；偶数行有 n−1 个黑格，共 n−1 行。", "因此黑格数=n²＋(n−1)²=2n²−2n＋1。也可用“黑格比白格多 1”得到 [(2n−1)²＋1]/2。", "先验证 n=1、2、3 得 1、5、13，再代入 100。第 13 题六边形是另一种结构：第一块 6 条边，以后每块多 5 条，6＋5(n−1)=5n＋1。"], "demo": "pattern", "steps": [{"text": "第 3 个棋盘，一行有多少格？", "options": ["3", "5", "6"], "answer": 1, "why": ["序号不是边长格数。", "2×3−1=5。", "相邻图边长每次增加 2，不是加倍。"], "hint": "观察 1、3、5 的边长。"}, {"text": "第 n 个图的黑格为何是 n²＋(n−1)²？", "options": ["因为每次加 4", "n 行各 n 个，另 n−1 行各 n−1 个", "因为黑格总是总格数的一半"], "answer": 1, "why": ["每次增加的黑格数不固定。", "对，按行分类，每格只数一次。", "总格数为奇数，黑格比白格多 1。"], "hint": "分别数奇数行和偶数行。"}, {"text": "第 100 个图黑格数为？", "options": ["401", "10000", "19801"], "answer": 2, "why": ["401 没有体现二维棋盘面积的增长。", "还漏掉另一类行的 99² 个。", "100²＋99²=10000＋9801=19801。"], "hint": "用两个正方形数相加。"}], "exam": [{"text": "第 5 个图黑格数为？", "options": ["25", "41", "81"], "answer": 1, "why": ["5²＋4²=41；81 是总格数。", "5²＋4²=41；81 是总格数。", "5²＋4²=41；81 是总格数。"], "hint": ""}, {"text": "一排 8 个共边六边形有多少条不同线段？", "options": ["48", "41", "40"], "answer": 1, "why": ["6＋7×5=41，共用边只数一次。", "6＋7×5=41，共用边只数一次。", "6＋7×5=41，共用边只数一次。"], "hint": ""}]};
(()=>{'use strict';
const $=s=>document.querySelector(s), key='math-lab-v1-'+LESSON.slug;
let state={step:0,done:[],result:null}, storage=true, exam=null, ei=0, responses=[];
try{const v=JSON.parse(localStorage.getItem(key));if(v&&Number.isInteger(v.step)&&v.step>=0&&v.step<=3&&Array.isArray(v.done)){state.step=v.step;state.done=v.done.filter(n=>[0,1,2].includes(n));if(Number.isInteger(v.result)&&v.result>=0&&v.result<=2)state.result=v.result;}}catch{storage=false;}

function question(q,independent){$('#question').innerHTML=`<h2>${q.text}</h2><div class="options">${q.options.map((s,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)} · ${s}</button>`).join('')}</div><div id="feedback" role="status" class="feedback"></div>${independent?'':`<div class="actions"><button id="hint">给我一点提示</button></div><p class="hint" id="hintText"></p>`}`;

function intro(){$('#app').innerHTML=`<article class="card"><span class="badge">换一道题 · 自己完成</span><h2>先不看提示，检查会不会迁移</h2><p>共 2 题。每题首次选择会被记下，全部完成后再看原因。可用纸笔，也可以选择“还不会”。</p><p>上次记录：${state.result===null?'还未完成':state.result+' / 2 题正确'}。建议隔一天再用纸笔复做原题。</p><button id="start" class="primary">开始独立检查</button></article>`;$('#start').onclick=()=>{exam=LESSON.exam;ei=0;responses=[];examQuestion();};}
function examQuestion(){if(ei>=exam.length){results();return;}$('#app').innerHTML=`<article class="card"><span class="badge">独立检查 ${ei+1} / ${exam.length}</span><div id="question"></div><div class="actions"><button id="skip">这题还不会</button></div><p class="small">首次选择即提交。中途离开本检查会丢失本轮未完成的答案。</p></article>`;question(exam[ei],true);$('#skip').onclick=()=>{responses.push(null);ei++;examQuestion();};}
function results(){const score=exam.filter((q,i)=>q.answer===responses[i]).length;state.result=score;save();$('#app').innerHTML=`<section class="card"><h2>本轮 ${score} / 2 题正确</h2><p>${score===2?'这两题已独立完成。请再口头解释一次为什么，明天用原题检验。':'已经找到值得再练的地方。先回到实验台，边操作边说出原因。'}</p>${exam.map((q,i)=>`<div class="scene"><b>${i+1}. ${q.text}</b><p>你的选择：${responses[i]===null?'还不会':q.options[responses[i]]}</p><p>正确答案：${q.options[q.answer]}</p><p>${q.why[responses[i]===null?q.answer:responses[i]]}</p></div>`).join('')}<button id="review" class="primary">回实验台复习</button> <button id="retry">重新检查</button><p class="small">重做使用同一组题，成绩提升也可能来自记忆；请结合纸笔迁移判断。</p></section>`;$('#review').onclick=()=>{state.step=0;exam=null;render();};$('#retry').onclick=()=>{exam=null;intro();};}
function scene(html){$('#scene').innerHTML=html;}
function slider(label,min,max,value,step=1){return `<div class="controls"><label for="range">${label}</label><input id="range" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><output id="value" for="range"></output></div>`;}
function live(fn){const r=$('#range');const draw=()=>{$('#value').textContent=r.value;fn(+r.value);};r.oninput=draw;draw();return draw;}
function tiles(values){return '<div class="tiles">'+values.map(s=>`<span class="tile">${s}</span>`).join('')+'</div>';}
function axis(points,min,max){const x=n=>40+600*(n-min)/(max-min);let out='<line x1="25" x2="675" y1="100" y2="100" stroke="#819582" stroke-width="2"/>';for(let i=min;i<=max;i+=max-min>25?3:1)out+=`<path d="M${x(i)} 100v6" stroke="#819582"/><text x="${x(i)}" y="130" text-anchor="middle" font-size="16">${i}</text>`;points.forEach((p,i)=>{out+=`<circle cx="${x(p[0])}" cy="100" r="7" fill="${i?'#ad5b2c':'#146b56'}"/><text x="${x(p[0])}" y="${40+i*24}" text-anchor="middle" font-size="18">${p[1]}</text>`;});return `<svg viewBox="0 0 700 155" role="img" aria-label="${points.map(p=>p[1]+' 在 '+fmt(p[0])).join('；')}">${out}</svg>`;}
function demo(){const type=LESSON.demo;
if(type==='terms'){scene('<p>把字母按同一顺序排列。改变系数或顺序，会改变“种类”吗？</p><label for="kind">与 3mn² 比较：</label><select id="kind"><option>−4n²m</option><option>5m²n</option><option>7mn²</option><option>3mn</option></select><div id="out"></div>');const draw=()=>{const i=$('#kind').selectedIndex;$('#out').innerHTML=tiles(['基准：m¹ n²',['比较：m¹ n²','比较：m² n¹','比较：m¹ n²','比较：m¹ n¹'][i]])+`<div class="formula">${['同一类：(3−4)mn² = −mn²','不同类：m、n 的指数都不匹配','同一类：(3＋7)mn² = 10mn²','不同类：n 的指数 2 ≠ 1'][i]}</div><p>换一个选项，解释是哪一个字母的指数决定了结果。</p>`;};$('#kind').onchange=draw;draw();}
if(type==='power'){scene('<p>固定数字 4，只改变指数。观察三种写法在奇数次、偶数次时的区别。</p>'+slider('指数 n',1,5,2)+'<div id="out"></div>');live(n=>{$('#out').innerHTML=tiles(Array(n).fill('4'))+`<p>|−4|<sup>${n}</sup> = ${Array(n).fill('4').join(' × ')} = <b>${4**n}</b></p><p>−4<sup>${n}</sup> = −(${4**n}) = <b>${-(4**n)}</b></p><p>(−4)<sup>${n}</sup> = ${Array(n).fill('(−4)').join(' × ')} = <b>${(-4)**n}</b></p><p>指数表示“乘了几个相同因子”，不是乘以 ${n}。</p>`;});}

if(type==='fee'){scene('<label for="mode">选择情境：</label><select id="mode"><option value="phone">话费：前 3 分钟共 0.22 元</option><option value="pen">水笔：前 10 支原价</option></select><p>先预测多用一个单位要多付多少，再拖动数量。</p>'+slider('总数量 x',1,40,5)+'<div id="out"></div>');const draw=live(x=>{const phone=$('#mode').value==='phone',cut=phone?3:10,extra=Math.max(0,x-cut),base=phone?.22:1.5*Math.min(x,10),price=phone?.2:.9,total=base+extra*price;$('#out').innerHTML=`<div style="display:flex;height:24px;border-radius:6px;overflow:hidden"><div style="width:${Math.min(x,cut)/40*100}%;background:#146b56"></div><div style="width:${extra/40*100}%;background:#ce8c40"></div></div>${tiles(['基础部分 '+Math.min(x,cut),'超出部分 '+extra])}<div class="formula">${fmt(base)} ＋ ${extra} × ${price} = ${total.toFixed(2)} 元</div><p>${phone?(x<=3?'还在前 3 分钟内，费用固定为 0.22 元。':'超出量是 x−3：0.22＋0.2(x−3)=0.2x−0.38。'):(x<=10?'未超过 10 支，甲店费用为 1.5x。':`甲：15＋0.9(x−10)=0.9x＋6；乙：1.2x=${(1.2*x).toFixed(2)} 元。`)}</p><p>先停在分界点，再增加 1：新增费用只来自超出部分。</p>`;});$('#mode').onchange=draw;}
if(type==='absolute'){scene('<p>固定 A 在 −5，移动 P。找出距离相等的两个位置，再检查是否重合。</p>'+slider('P 的位置',-7,7,0)+'<div id="out"></div>');live(p=>{$('#out').innerHTML=axis([[-5,'A'],[p,'P']],-7,7)+tiles(['OA=5','OP='+Math.abs(p),'若 P=m−3，则 m='+(p+3)])+`<p>${Math.abs(p)!==5?'还不等距。尝试把 P 移到 5 或 −5。':p===-5?'等距，但两点重合，不满足“不同两点”。':'等距，且两点不同：这才是有效位置。'}</p>`;});}
if(type==='relations'){scene('<p>具体的 x、y 改变时，比值会不会变？这里始终设 x=−y。</p>'+slider('y（0 不允许）',-5,5,2)+'<label for="z">z 的分支：</label><select id="z"><option value="1">z=1</option><option value="-1">z=−1</option></select><div id="out"></div>');const draw=live(y=>{$('#out').innerHTML=y===0?'<p class="feedback">y=0 时不能计算 x/y，原式无意义，必须排除。</p>':`<div class="formula">x=${-y}，y=${y}，x/y=−1<br>1−3×(−1)＋(${$('#z').value}) = ${4+Number($('#z').value)}</div><p>换一个非零 y：固定部分一直等于 4。</p>`;});$('#z').onchange=draw;}
if(type==='sum'){scene('<p>逐天加入记录。比较“差值累计”和“实际量累计”，两条路应汇合。</p>'+slider('已记录天数',0,7,0)+'<div id="out"></div>');live(n=>{const all=[5,-2,-5,14,-8,22,-6],a=all.slice(0,n),positive=a.filter(v=>v>0).reduce((s,v)=>s+v,0),negative=a.filter(v=>v<0).reduce((s,v)=>s+v,0),sum=positive+negative;$('#out').innerHTML=tiles(a.map((v,i)=>`第${i+1}天：${v>0?'+':''}${v}`))+`<p>正数合计 ${positive}，负数合计 ${negative}，净变化 ${sum}。</p><div class="formula">基准法：${n}×100＋(${sum}) = ${n*100+sum}<br>逐天法：${a.map(v=>100+v).join('＋')||'0'} = ${a.reduce((s,v)=>s+100+v,0)}</div><p>两条路径结果一致，才更可靠。全部 7 天完成后再算收入。</p>`;});}
if(type==='definition'){scene('<p>满足条件的 m、n 不止一组。改变 m，让 n 自动满足 4m²−3n=2，观察目标值。</p>'+slider('m',0,5,1)+'<div id="out"></div>');live(m=>{const n=(4*m*m-2)/3;$('#out').innerHTML=`<p>取 n=(${4*m*m}−2)/3=${fmt(n)}（小数显示为近似）。</p><div class="formula">4m²−3n = 2<br>8m²−6n＋2024 = 2×2＋2024 = 2028</div><p>m 与 n 都能变，但这个整体始终等于 2。不是必须分别求出每个字母。</p>`;});}
if(type==='pattern'){scene('<p>每个黑格标出所在行类别。先数一行，再数这样的行有几行。</p>'+slider('图形序号 n',1,8,3)+'<div id="out"></div>');live(n=>{const side=2*n-1,cell=280/side;let cells='';for(let r=0;r<side;r++)for(let c=0;c<side;c++)cells+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="${(r+c)%2?'#fff':r%2?'#a76532':'#193c39'}" stroke="#c6d4c2"/>`;$('#out').innerHTML=`<svg viewBox="0 0 300 290" style="max-width:310px;margin:auto" role="img" aria-label="${side}乘${side}棋盘，黑格${n*n+(n-1)**2}个">${cells}</svg><p>深绿：${n} 行，每行 ${n} 个；棕色：${n-1} 行，每行 ${n-1} 个。两色都表示原题中的黑格。</p><div class="formula">${n}²＋${n-1}² = ${n*n+(n-1)**2}</div><p>总格数 ${side}²=${side*side}；黑格比白格多 1，也得到 (${side*side}＋1)÷2。</p>`;});}
if(type==='iteration'){scene('<p>先猜下一项，再增加项数。留意：重复一个数后，确定的规则会把后续路线也重复。</p>'+slider('显示前几项',1,16,1)+'<div id="out"></div>');live(n=>{let a=[10];while(a.length<n){const last=a.at(-1);a.push(last%2?3*last+1:last/2);}$('#out').innerHTML=tiles(a.map((v,i)=>`a${i+1}：${v}`))+`<div class="formula">当前 ${a.at(-1)} 是${a.at(-1)%2?'奇':'偶'}数，下一项用${a.at(-1)%2?'3a＋1':'a÷2'}得到 ${a.at(-1)%2?3*a.at(-1)+1:a.at(-1)/2}</div><p>已显示部分的和：${a.reduce((s,v)=>s+v,0)}。${n>=8?'第 5 项与第 8 项都是 4，此后重复 4→2→1→4。':'继续观察，循环并非从第 1 项开始。'}</p>`;});}
if(type==='brackets'){scene('<p>同一个 U，用整体法和展开法算，结果应一致。这里固定 b=3，改变 a。</p>'+slider('a',-3,5,2)+'<div id="out"></div>');live(a=>{const u=2*(a+3)-3*a;$('#out').innerHTML=`<div class="formula">U=2(${a}＋3)−(${a})×3=${u}<br>整体法：3U−U = 2×(${u}) = ${2*u}<br>展开法：4a＋4b−2ab = ${4*a}＋12−(${6*a}) = ${2*u}</div><p>无论怎样改变 a，两种算法一致。回到原题的条件 a=2、b=3 时，结果为 8。</p>`;});}
if(type==='coeff'){scene('<label for="params">选择参数：</label><select id="params"><option value="0">n=1，m=4：只剩二次项</option><option value="1">n=2，m=1：只剩一次项</option><option value="2">n=2，m=4：两项都消失</option></select><p>先选参数，再移动 x。想让所有 x 都给出同一结果，需要去掉哪些项？</p>'+slider('x',-3,3,0)+'<div id="out"></div>');const draw=live(x=>{const pairs=[[1,4],[2,1],[2,4]], [n,m]=pairs[+$('#params').value],a=3*n-6,b=m-4;$('#out').innerHTML=`<div class="formula">(${a})x²＋(${b})x−14<br>x=${x} 时，值为 ${a*x*x+b*x-14}</div><p>x² 的系数：${a}；x 的系数：${b}。${a===0&&b===0?'两项均消失，只剩常数 −14。':'仍有含 x 的项；某一次恰好等于 −14，不代表与 x 无关。'}</p>`;});$('#params').onchange=draw;}
if(type==='rolling'){scene('<label for="direction">两圆方向：</label><select id="direction"><option value="0">大向右，小向右</option><option value="1">大向左，小向左</option><option value="2">大向右，小向左</option><option value="3">大向左，小向右</option></select><p>数轴刻度以 π 为单位；大、小两点表示当时圆与数轴的接触位置。</p>'+slider('时间（秒）',0,9,0,.5)+'<div id="out"></div><button id="target">到达相距 9π 的时刻</button><details><summary>再看往返运动：第 26(1)</summary><div class="scroll"><table><tr><th>次数</th><th>本次时间</th><th>累计时间</th><th>位置</th></tr>'+[-1,2,-4,-2,3,6].map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>${[-1,1,-3,-5,-2,4][i]}</td><td>${[-2,2,-6,-10,-4,8][i]}π</td></tr>`).join('')+'</table></div><p>最远：第 4 次，距离 10π。总路程：(1＋2＋4＋2＋3＋6)×2π=36π。最终距离：|8π|=8π。</p></details>');const draw=live(t=>{const i=+$('#direction').value,[a,b]=[[2,1],[-2,-1],[2,-1],[-2,1]][i],big=a*t,small=b*t;$('#out').innerHTML=axis([[big,'大'],[small,'小']],-18,18)+`<div class="formula">大：${fmt(big)}π；小：${fmt(small)}π<br>间距 = |${fmt(big)}−(${fmt(small)})|π = ${fmt(Math.abs(big-small))}π</div><p>${i<2?'同向：每秒增加 (2−1)π=π。':'异向：每秒增加 (2＋1)π=3π。'}${Math.abs(big-small)===9?'✓ 已到目标距离。记下这组有序位置，再切换方向。':''}</p>`;});$('#direction').onchange=draw;$('#target').onclick=()=>{$('#range').value=+$('#direction').value<2?9:3;draw();};}
}
$('#reset').onclick=()=>{if(confirm('清除本课的进度和检查记录，重新学习？')){state={step:0,done:[],result:null};exam=null;render();}};
render();
})();
</script></body></html>
